pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'KidSafeApp'

include ':app'

includeBuild(new File(
    ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"]
        .execute(null, rootDir).text.trim()
).parentFile.parentFile.absolutePath)