workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      node: 18.19.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
